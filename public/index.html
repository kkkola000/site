<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f3f7">
<meta name="base-path" content="__BASE__">
<title>Заказы · Яндекс Доставка</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
<link rel="stylesheet" href="__BASE__/styles.css">
</head>
<body>
<header class="topbar">
  <div class="topbar__inner">
    <div class="search">
      <svg class="search__icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path>
      </svg>
      <input id="search" type="search" placeholder="Номер заказа, товар, артикул, трек" autocomplete="off" spellcheck="false">
      <button id="search-clear" class="search__clear" type="button" hidden aria-label="Очистить">✕</button>
    </div>
    <button id="refresh" class="icon-btn" type="button" title="Обновить" aria-label="Обновить">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 11a8 8 0 10-2.3 5.7"></path><path d="M20 4v7h-7"></path>
      </svg>
    </button>
    <button id="settings" class="icon-btn" type="button" title="Настройки" aria-label="Настройки">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="3.2"></circle>
        <path d="M19.4 13.5a7.7 7.7 0 000-3l1.8-1.4-1.9-3.2-2.1.9a7.6 7.6 0 00-2.6-1.5L14.2 2H9.8l-.4 2.3a7.6 7.6 0 00-2.6 1.5l-2.1-.9L2.8 8.1l1.8 1.4a7.7 7.7 0 000 3l-1.8 1.4 1.9 3.2 2.1-.9a7.6 7.6 0 002.6 1.5l.4 2.3h4.4l.4-2.3a7.6 7.6 0 002.6-1.5l2.1.9 1.9-3.2-1.8-1.4z"></path>
      </svg>
    </button>
  </div>
  <nav class="tabs" id="tabs" aria-label="Разделы заказов"></nav>
</header>

<main class="content">
  <div id="banner" class="banner" hidden></div>
  <div id="list" class="list" aria-live="polite"></div>
  <div id="skeleton" class="list">
    <div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div>
  </div>
</main>

<footer class="footer">
  <span id="updated"></span>
</footer>

<div class="drawer" id="drawer" hidden>
  <div class="drawer__backdrop" data-close></div>
  <aside class="drawer__panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
    <div class="drawer__head">
      <h2 id="drawer-title">Заказ</h2>
      <button class="icon-btn" type="button" data-close aria-label="Закрыть">✕</button>
    </div>
    <div class="drawer__body" id="drawer-body"></div>
  </aside>
</div>

<script src="__BASE__/app.js" type="module"></script>
</body>
</html>
