# Прокси на панель заказов. Устанавливается в /etc/nginx/sites-available/__SERVICE__
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    access_log /var/log/nginx/__SERVICE__.access.log;
    error_log  /var/log/nginx/__SERVICE__.error.log;

    # Ярлыки в PDF могут генерироваться дольше обычного запроса.
    proxy_read_timeout 120s;
    client_max_body_size 2m;

    location / {
        # Кто может открывать панель (сети VPN). Файл ведёт deploy.sh.
        include __ACCESS_SNIPPET__;

        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
